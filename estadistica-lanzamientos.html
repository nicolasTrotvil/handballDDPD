<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Condensed:wght@400;600;700&family=Montserrat:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <title>Estadística de Lanzamientos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --imef-azul:    #1A57B0;
      --imef-verde:   #278035;
      --imef-rojo:    #CC1B2C;
      --imef-purpura: #7920A2;
      --imef-naranja: #C86500;
      --accent:       #B0121F;
      --accent2:      #278035;
      --danger:       #CC1B2C;
      --ink:          #142A4D;
      --text:         #142A4D;
      --text-soft:    #5C6C82;
      --soft:         #D7DCE4;
      --bg:           #F1F3F6;
      --bg-panel:     #FFFFFF;
      --bg-raised:    #FAFBFC;
      --gol:    #278035;
      --fallo:  #CC1B2C;
      --parada: #C86500;
    }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background: var(--bg);
      background-image: radial-gradient(circle, rgba(20,42,77,0.035) 1px, transparent 1.2px);
      background-size: 16px 16px;
      min-height: 100vh; padding-bottom: 32px; color: var(--text);
    }

    /* ── Header ── */
    .encabezado {
      background: var(--bg-panel); color: var(--text); padding: 12px 20px;
      border-bottom: 3px solid var(--ink); position: relative; overflow: hidden;
    }
    .encabezado::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(115deg, rgba(20,42,77,0.04) 0px, rgba(20,42,77,0.04) 1px, transparent 1px, transparent 12px);
      mask-image: linear-gradient(to right, transparent, black 30%, black 70%, transparent);
    }
    .encabezado h1 {
      font-family: 'Cabin Condensed', system-ui; font-size: 1rem; font-weight: 400;
      text-transform: uppercase; letter-spacing: .08em; color: var(--accent); position: relative;
    }
    .encabezado small { font-size: .72rem; opacity: .55; position: relative; }

    /* ── Partido ── */
    .partido {
      background: var(--bg-panel); padding: 10px 16px; display: flex; flex-wrap: wrap;
      gap: 6px 14px; align-items: flex-end; border-bottom: 2px solid var(--ink);
    }
    .campo { display: flex; flex-direction: column; gap: 2px; }
    .campo label { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-soft); }
    .campo input, .campo select {
      border: 2px solid var(--ink); border-radius: 2px; padding: 5px 9px;
      font-size: .88rem; color: var(--text); font-weight: 600;
      font-family: 'Montserrat', system-ui;
    }
    .campo input:focus, .campo select:focus { outline: none; border-color: var(--accent); }
    .campo-eq input { width: 140px; }
    .vs { font-weight: 800; color: var(--accent); padding-bottom: 5px; }
    /* ── Layout principal ── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 12px;
      padding: 12px;
      max-width: 1100px;
      margin: 0 auto;
    }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

    /* ── Panel izquierdo (cancha + controles) ── */
    .panel-registro { display: flex; flex-direction: column; gap: 10px; }

    /* ── Tipo tabs ── */
    .tipo-tabs { display: flex; gap: 6px; }
    .tab {
      flex: 1; padding: 9px 12px; border: 2px solid var(--ink); border-radius: 2px;
      background: var(--bg-panel); color: var(--text); font-weight: 700; font-size: .85rem;
      cursor: pointer; text-align: center; transition: transform .12s, box-shadow .12s;
      font-family: 'Montserrat', system-ui;
    }
    .tab.activo { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 2px 8px rgba(20,42,77,0.08); }
    .tab:hover:not(.activo) { background: var(--soft); transform: translateY(-2px); box-shadow: 0 2px 8px rgba(20,42,77,0.08); }

    /* ── Pasos / indicadores ── */
    .pasos { display: flex; gap: 8px; }
    .paso {
      flex: 1; background: var(--bg-panel); border: 2px solid var(--ink); border-radius: 2px;
      padding: 7px 12px; font-size: .8rem; font-weight: 600; color: var(--text-soft);
      text-align: center; transition: all .2s;
    }
    .paso.activo { border-color: var(--accent); color: var(--accent); background: var(--soft); }
    .paso.ok { border-color: var(--gol); color: var(--gol); background: #e8f8ef; }

    /* ── Cancha (imagen + SVG overlay) ── */
    .cancha-wrap {
      position: relative; border-radius: 2px; overflow: hidden;
      box-shadow: 0 4px 16px rgba(20,42,77,0.11); border: 2px solid var(--ink);
      background: var(--bg-panel);
    }
    .cancha-wrap img { display: block; width: 100%; height: auto; }
    #cancha-svg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    .cancha-wrap.solo-arco { aspect-ratio: 330 / 258; }
    .cancha-wrap.solo-arco img { display: none; }

    /* ── Zonas SVG ── */
    .gz {
      fill: transparent; stroke: rgba(204,27,44,.4); stroke-width: 1.5; cursor: pointer;
      transition: fill .1s;
    }
    .gz:hover { fill: rgba(204,27,44,.2); stroke: rgba(204,27,44,.8); stroke-width: 2; }
    .gz.sel   { fill: rgba(204,27,44,.55); stroke: rgba(204,27,44,1); stroke-width: 3; }

    .cz {
      fill: transparent; stroke: rgba(26,87,176,0); stroke-width: 2; cursor: pointer;
      transition: fill .1s;
    }
    .cz:hover { fill: rgba(26,87,176,.15); stroke: rgba(26,87,176,.5); }
    .cz.sel   { fill: rgba(26,87,176,.38); stroke: rgba(26,87,176,.9); stroke-width: 3; }

    .zona-label {
      font-size: 22px; font-weight: 900; fill: rgba(26,26,46,.6);
      text-anchor: middle; dominant-baseline: middle; pointer-events: none;
      font-family: 'Roboto Mono', monospace;
    }
    text[id^="gzl-"] { fill: rgba(204,27,44,.85); }

    .gz-lbl {
      font-size: 28px; font-weight: 900; fill: white;
      text-anchor: middle; dominant-baseline: middle; pointer-events: none;
      font-family: 'Roboto Mono', monospace; display: none;
    }
    .cz-lbl {
      font-size: 28px; font-weight: 900; fill: white;
      text-anchor: middle; dominant-baseline: middle; pointer-events: none;
      font-family: 'Roboto Mono', monospace; display: none;
    }

    /* ── Controles debajo de la cancha ── */
    .controles {
      background: var(--bg-panel); border-radius: 2px; padding: 12px;
      box-shadow: 0 2px 12px rgba(20,42,77,0.09); border: 2px solid var(--ink);
    }
    .res-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 10px; }
    .rb {
      padding: 10px 4px; border: 2px solid; border-radius: 2px;
      cursor: pointer; font-weight: 700; font-size: .88rem; background: var(--bg-panel);
      transition: transform .12s, box-shadow .12s; text-align: center;
      font-family: 'Montserrat', system-ui;
    }
    .rb.gol    { border-color: var(--gol);    color: var(--gol); }
    .rb.fallo  { border-color: var(--fallo);  color: var(--fallo); }
    .rb.parada { border-color: var(--parada); color: var(--parada); }
    .rb.on.gol    { background: var(--gol);    color: white; box-shadow: 0 2px 8px rgba(20,42,77,0.08); }
    .rb.on.fallo  { background: var(--fallo);  color: white; box-shadow: 0 2px 8px rgba(20,42,77,0.08); }
    .rb.on.parada { background: var(--parada); color: white; box-shadow: 0 2px 8px rgba(20,42,77,0.08); }
    .rb:hover:not(.on) { transform: translateY(-2px); box-shadow: 0 1px 6px rgba(20,42,77,0.07); }

    .flash {
      font-size: .82rem; font-weight: 600; text-align: center;
      padding: 7px; border-radius: 2px; margin-bottom: 8px; display: none;
    }
    .flash.ok  { background: #e8f8ef; color: var(--gol);   display: block; border-left: 3px solid var(--gol); }
    .flash.err { background: #fdecea; color: var(--fallo); display: block; border-left: 3px solid var(--fallo); }

    .btn-reg {
      width: 100%; padding: 12px; background: var(--accent); color: white;
      border: 2px solid var(--ink); border-radius: 2px;
      font-size: 1.05rem; font-weight: 400; cursor: pointer;
      letter-spacing: .05em; text-transform: uppercase;
      transition: transform .12s, box-shadow .12s;
      font-family: 'Cabin Condensed', system-ui;
    }
    .btn-reg:disabled { background: #bbb; border-color: #bbb; cursor: not-allowed; box-shadow: none; }
    .btn-reg:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 2px 12px rgba(20,42,77,0.09); }

    /* ── Panel derecho (stats) ── */
    .panel-stats { display: flex; flex-direction: column; gap: 10px; }

    .stats-card {
      background: var(--bg-panel); border-radius: 2px;
      box-shadow: 0 2px 12px rgba(20,42,77,0.09); border: 2px solid var(--ink); overflow: hidden;
    }
    .stats-titulo {
      background: var(--accent); color: white; padding: 8px 14px;
      font-family: 'Cabin Condensed', system-ui;
      font-size: .82rem; font-weight: 400; letter-spacing: .07em; text-transform: uppercase;
    }
    .stats-body { padding: 12px; }

    .badges { display: flex; gap: 6px; margin-bottom: 10px; }
    .badge {
      flex: 1; text-align: center; padding: 5px 2px;
      border-radius: 2px; font-size: .75rem; font-weight: 700;
      font-family: 'Roboto Mono', monospace;
    }
    .badge.g { background: #e8f8ef; color: var(--gol); }
    .badge.f { background: #fdecea; color: var(--fallo); }
    .badge.p { background: #fef5ec; color: var(--parada); }

    table { width: 100%; border-collapse: collapse; font-size: .78rem; }
    thead th {
      background: var(--soft); padding: 5px 6px; text-align: left;
      color: var(--text); font-weight: 700; font-size: .7rem; border-bottom: 2px solid var(--ink);
      font-family: 'Roboto Mono', monospace;
    }
    tbody td { padding: 4px 6px; border-bottom: 1px solid var(--soft); }
    .chip {
      display: inline-block; padding: 1px 7px; border-radius: 2px;
      font-size: .7rem; font-weight: 700;
      font-family: 'Roboto Mono', monospace;
    }
    .chip.Gol    { background: #e8f8ef; color: var(--gol); }
    .chip.Fallo  { background: #fdecea; color: var(--fallo); }
    .chip.Parada { background: #fef5ec; color: var(--parada); }
    .vacio { text-align: center; color: #ccc; padding: 14px; font-size: .82rem; }

    /* ── Tabs stats ── */
    .stats-tabs { display: flex; border-bottom: 2px solid var(--ink); margin-bottom: 8px; }
    .stab {
      padding: 5px 10px; font-size: .75rem; font-weight: 700; color: var(--text-soft);
      cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px;
    }
    .stab.on { color: var(--accent); border-color: var(--accent); }

    /* ── Botones extra partido ── */
    .btn-exportar {
      padding: 6px 14px; background: var(--gol); color: white;
      border: 2px solid var(--ink); border-radius: 2px;
      font-size: .82rem; font-weight: 700; cursor: pointer; align-self: flex-end;
      transition: transform .12s, box-shadow .12s;
    }
    .btn-exportar:hover { transform: translateY(-2px); box-shadow: 0 2px 8px rgba(20,42,77,0.08); }
    .btn-borrar {
      padding: 6px 14px; background: var(--bg-panel); color: var(--fallo);
      border: 2px solid var(--fallo); border-radius: 2px;
      font-size: .82rem; font-weight: 700; cursor: pointer; align-self: flex-end;
      transition: transform .12s, box-shadow .12s;
    }
    .btn-borrar:hover { background: #fdecea; transform: translateY(-2px); box-shadow: 3px 3px 0 var(--fallo); }

    /* ── Print / PDF ── */
    @media print {
      body { background: white; padding: 0; background-image: none; }
      .encabezado { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .btn-exportar, .btn-borrar { display: none !important; }
      .partido { box-shadow: none; border-bottom: 2px solid var(--ink); padding: 8px 16px; }
      .campo input, .campo select {
        border: none; padding: 2px 0; background: transparent;
        font-size: .9rem; color: var(--text); font-weight: 600;
      }
      .panel-registro { display: none !important; }
      .layout { grid-template-columns: 1fr !important; padding: 8px; }
      .panel-stats {
        flex-direction: row; gap: 12px;
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
      }
      .stats-card { flex: 1; box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
      .flash { display: none !important; }
      .stats-titulo {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
      }
      .badge {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
      }
      .chip {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
      }
    }
  
/* ── Identidad IMEF: estilo limpio-profesional ── */

/* Stripe del header: oculto */
.header::before, .inst-header::before { display: none; }

/* Header — borde suave, sombra difusa */
.header, .inst-header {
  border-bottom: 1px solid var(--soft) !important;
  box-shadow: 0 2px 10px rgba(20,42,77,0.07) !important;
}

/* Body — dot grid apenas visible */
body {
  background-image: radial-gradient(circle, rgba(20,42,77,0.035) 1px, transparent 1.2px) !important;
}

/* Cards y paneles principales */
.datos-wrap, .tipo-wrap, .campo-wrap, .sec, .reg-card,
.excl-card, .duracion-wrap, .dim, .leyenda, .card,
.sint-card, .nota-exp { border-radius: 10px !important; }

/* Cards con overflow hidden para respetar radius */
.campo-wrap, .sec, .dim, .reg-card { overflow: hidden !important; }

/* Cronómetro — display en azul institucional, contenedor elegante */
.crono-wrap { border-radius: 16px !important; overflow: hidden !important; }
.crono-display { color: var(--accent) !important; letter-spacing: 8px !important; }
.crono-display.warning { color: var(--imef-naranja) !important; }
.crono-display.danger  { color: var(--danger) !important; }

/* Badges de número: circulares */
.campo-num, .dim-num { border-radius: 50% !important; }

/* Botones principales */
.btn-pdf, .btn-reset, .act-btn, .ctrl-btn, .dur-btn,
.tipo-btn, .tab { border-radius: 6px !important; }

/* Botones pequeños */
.excl-eq-btn, .cnt-btn { border-radius: 4px !important; }

/* Inputs y selects */
.field input, .field select, .obs-textarea, .marcador-input,
.custom-input, .excl-num-input { border-radius: 6px !important; }

/* Checkboxes — levemente redondeados */
.check-box, .vacio-check { border-radius: 4px !important; }

/* Escala de valoración */
.escala { border-radius: 6px !important; overflow: hidden !important; }

/* Badges y etiquetas */
.card-badge, .nivel-badge, .lbadge, .title-tag { border-radius: 4px !important; }

/* Timeout dot — circular */
.timeout-dot { border-radius: 50% !important; }

/* Excl card — sin overflow para no cortar el badge */
.excl-card { overflow: visible !important; }

/* Exclusión finalizada badge */
.excl-badge-fin { border-radius: 6px !important; }


/* ── Sistema monocromo con acento único ── */
.header::before, .inst-header::before {
  inset: unset;
  display: block;
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(to right, var(--imef-rojo) 20%, var(--imef-purpura) 20% 40%, var(--imef-verde) 40% 60%, var(--imef-azul) 60% 80%, var(--imef-naranja) 80%);
  mask-image: none;
}
.header, .inst-header {
  border-bottom: 1px solid var(--soft) !important;
  box-shadow: 0 1px 4px rgba(20,42,77,0.06) !important;
}
</style>
</head>
<body>

<div class="encabezado">
  <h1>Estadística de Lanzamientos</h1>
  <small>IMEF · Handball</small>
</div>

<div class="partido">
  <div class="campo campo-eq">
    <label>Equipo Local</label>
    <input type="text" id="eqL" placeholder="Local" autocomplete="off">
  </div>
  <span class="vs">vs</span>
  <div class="campo campo-eq">
    <label>Equipo Visitante</label>
    <input type="text" id="eqV" placeholder="Visitante" autocomplete="off">
  </div>
  <div class="campo">
    <label>Fecha</label>
    <input type="date" id="fecha">
  </div>
  <div class="campo">
    <label>Parte</label>
    <select id="parte">
      <option value="1">1°</option>
      <option value="2">2°</option>
    </select>
  </div>
  <button class="btn-exportar" onclick="exportarPDF()">Exportar PDF</button>
  <button class="btn-borrar"   onclick="borrarSesion()">Borrar sesión</button>
</div>

<div class="layout">

  <!-- ── Panel izquierdo ── -->
  <div class="panel-registro">

    <div class="tipo-tabs">
      <button class="tab activo" id="tab-7m"   onclick="setTipo('7m')">⚡ 7 Metros</button>
      <button class="tab"        id="tab-ca"   onclick="setTipo('ca')">🏃 Contraataque</button>
      <button class="tab"        id="tab-zona" onclick="setTipo('zona')">🎯 Zona</button>
    </div>

    <div class="pasos">
      <div class="paso" id="p1">1. Tocá la zona de la cancha</div>
      <div class="paso" id="p2">2. Tocá la zona del arco</div>

<script>
  // ── Estado ──────────────────────────────────────────────────────────────────
  const TIPOS_STR = { '7m': '7 Metros', 'ca': 'Contraataque', 'zona': 'Zona' };

  const st = {
    tipo:       '7m',
    zonaCancha: null,
    zonaArco:   null,
    resultado:  null,
    regs: { '7m': [], 'ca': [], 'zona': [] }
  };

  // ── Init ────────────────────────────────────────────────────────────────────
  function init() {
    document.getElementById('fecha').valueAsDate = new Date();
    ['eqL','eqV','fecha','parte'].forEach(id =>
      document.getElementById(id).addEventListener('change', cargarSesionAuto)
    );
    document.getElementById('eqL').addEventListener('blur', cargarSesionAuto);
    document.getElementById('eqV').addEventListener('blur', cargarSesionAuto);
    setTipo('7m');
  }

  // ── Tipo ────────────────────────────────────────────────────────────────────
  function setTipo(tipo) {
    st.tipo = tipo;
    const soloArco = tipo !== 'zona';
    const svg  = document.getElementById('cancha-svg');
    const wrap = document.querySelector('.cancha-wrap');
    if (soloArco) {
      wrap.classList.add('solo-arco');
      svg.setAttribute('viewBox', '438 210 330 258');
      document.querySelectorAll('.cz').forEach(el => el.style.display = 'none');
      document.querySelectorAll('[id^="czl-"]').forEach(el => el.style.display = 'none');
    } else {
      wrap.classList.remove('solo-arco');
      svg.setAttribute('viewBox', '0 0 1191 876');
      document.querySelectorAll('.cz').forEach(el => el.style.display = '');
      document.querySelectorAll('[id^="czl-"]').forEach(el => el.style.display = '');
    }
    document.getElementById('p2').style.display = soloArco ? 'none' : '';
    ['7m','ca','zona'].forEach(t =>
      document.getElementById('tab-' + t).className = 'tab' + (tipo === t ? ' activo' : '')
    );
    resetSeleccion();
  }

  // ── Selección de zona cancha ─────────────────────────────────────────────────
  function elegirCancha(zona) {
    if (st.zonaCancha !== null) {
      clearCZ(st.zonaCancha);
    }
    st.zonaCancha = zona;
    document.getElementById('cz-' + zona).classList.add('sel');
    document.getElementById('czl-' + zona).style.fill = 'white';
    actualizarPasos();
    checkListo();
  }

  // ── Selección de zona arco ───────────────────────────────────────────────────
  function elegirArco(zona) {
    if (st.zonaArco !== null) {
      clearGZ(st.zonaArco);
    }
    st.zonaArco = zona;
    document.getElementById('gz-' + zona).classList.add('sel');
    document.getElementById('gzl-' + zona).style.fill = 'white';
    actualizarPasos();
    checkListo();
  }

  // ── Resultado ────────────────────────────────────────────────────────────────
  function elegirRes(resultado, btn) {
    st.resultado = resultado;
    document.querySelectorAll('.rb').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    checkListo();
  }

  // ── Pasos visuales ───────────────────────────────────────────────────────────
  function actualizarPasos() {
    const p1 = document.getElementById('p1');
    const p2 = document.getElementById('p2');
    const soloArco = st.tipo !== 'zona';
    if (soloArco) {
      if (st.zonaArco !== null) {
        p1.textContent = '1. Arco: zona ' + st.zonaArco + ' ✓';
        p1.className = 'paso ok';
      } else {
        p1.textContent = '1. Tocá la zona del arco';
        p1.className = 'paso activo';
      }
    } else {
      if (st.zonaCancha !== null) {
        p1.textContent = '1. Cancha: zona ' + st.zonaCancha + ' ✓';
        p1.className = 'paso ok';
      } else {
        p1.textContent = '1. Tocá la zona de la cancha';
        p1.className = 'paso';
      }
      if (st.zonaArco !== null) {
        p2.textContent = '2. Arco: zona ' + st.zonaArco + ' ✓';
        p2.className = 'paso ok';
      } else {
        p2.textContent = '2. Tocá la zona del arco';
        p2.className = st.zonaCancha !== null ? 'paso activo' : 'paso';
      }
    }
  }

  // ── Listo para registrar ─────────────────────────────────────────────────────
  function checkListo() {
    const needsCancha = st.tipo === 'zona';
    const ok = (!needsCancha || st.zonaCancha !== null) &&
               st.zonaArco !== null &&
               st.resultado !== null;
    document.getElementById('btn-reg').disabled = !ok;
  }

  // ── Partido ──────────────────────────────────────────────────────────────────
  function partido() {
    return {
      equipoLocal:     document.getElementById('eqL').value.trim(),
      equipoVisitante: document.getElementById('eqV').value.trim(),
      fecha:           document.getElementById('fecha').value,
      parte:           document.getElementById('parte').value,
    };
  }

  // ── Registrar ────────────────────────────────────────────────────────────────
  function registrar() {
    const p = partido();
    if (!p.equipoLocal || !p.equipoVisitante || !p.fecha) {
      flash('Completá los datos del partido primero', 'err'); return;
    }
    const payload = {
      ...p,
      tipo:       st.tipo,
      zonaCancha: st.zonaCancha,
      zonaArco:   st.zonaArco,
      resultado:  st.resultado,
    };
    const btn = document.getElementById('btn-reg');
    btn.disabled = true;
    btn.textContent = 'Guardando…';

    try {
      const tipoStr = TIPOS_STR[payload.tipo];
      const todos = JSON.parse(localStorage.getItem('imef_lanz') || '[]');
      const numero = todos.filter(r =>
        r.equipoLocal     === payload.equipoLocal     &&
        r.equipoVisitante === payload.equipoVisitante &&
        r.fecha           === payload.fecha           &&
        String(r.parte)   === String(payload.parte)   &&
        r.tipo            === tipoStr
      ).length + 1;
      todos.push({
        timestamp:        new Date().toISOString(),
        equipoLocal:      payload.equipoLocal,
        equipoVisitante:  payload.equipoVisitante,
        fecha:            payload.fecha,
        parte:            payload.parte,
        tipo:             tipoStr,
        numero,
        zonaCancha:       payload.zonaCancha,
        zonaArco:         payload.zonaArco,
        resultado:        payload.resultado,
      });
      localStorage.setItem('imef_lanz', JSON.stringify(todos));
      onGuardado(payload, { ok: true, numero });
    } catch(err) {
      flash('Error: ' + err.message, 'err');
      btn.disabled = false;
      btn.textContent = 'Registrar';
    }
  }

  function onGuardado(payload, res) {
    const tipo = payload.tipo;
    st.regs[tipo].push({
      numero:     res.numero,
      zonaCancha: payload.zonaCancha,
      zonaArco:   payload.zonaArco,
      resultado:  payload.resultado,
    });
    flash('✓ N°' + res.numero + (payload.zonaCancha ? ' — C' + payload.zonaCancha : '') + ' → A' + payload.zonaArco + ' — ' + payload.resultado, 'ok');
    resetSeleccion();
    renderTabla(tipo);
    renderTotales(tipo);
  }

  // ── Auto-carga silenciosa ────────────────────────────────────────────────────
  function cargarSesionAuto() {
    const p = partido();
    if (!p.equipoLocal || !p.equipoVisitante || !p.fecha) return;
    try {
      const todos = JSON.parse(localStorage.getItem('imef_lanz') || '[]');
      const datos = todos
        .filter(r =>
          r.equipoLocal     === p.equipoLocal     &&
          r.equipoVisitante === p.equipoVisitante &&
          r.fecha           === p.fecha           &&
          String(r.parte)   === String(p.parte)
        )
        .map(r => ({
          tipo:       r.tipo === '7 Metros' ? '7m' : r.tipo === 'Contraataque' ? 'ca' : 'zona',
          numero:     Number(r.numero),
          zonaCancha: Number(r.zonaCancha) || null,
          zonaArco:   Number(r.zonaArco),
          resultado:  r.resultado,
        }));
      st.regs['7m']   = datos.filter(d => d.tipo === '7m');
      st.regs['ca']   = datos.filter(d => d.tipo === 'ca');
      st.regs['zona'] = datos.filter(d => d.tipo === 'zona');
      ['7m','ca','zona'].forEach(t => { renderTabla(t); renderTotales(t); });
    } catch(err) { /* silencioso */ }
  }

  // ── Reset ────────────────────────────────────────────────────────────────────
  function resetSeleccion() {
    if (st.zonaCancha !== null) { clearCZ(st.zonaCancha); st.zonaCancha = null; }
    if (st.zonaArco   !== null) { clearGZ(st.zonaArco);   st.zonaArco   = null; }
    st.resultado = null;
    document.querySelectorAll('.rb').forEach(b => b.classList.remove('on'));
    document.getElementById('btn-reg').disabled = true;
    document.getElementById('btn-reg').textContent = 'Registrar';
    actualizarPasos();
  }

  function clearCZ(z) {
    document.getElementById('cz-' + z).classList.remove('sel');
    document.getElementById('czl-' + z).style.fill = '';
  }
  function clearGZ(z) {
    document.getElementById('gz-' + z).classList.remove('sel');
    document.getElementById('gzl-' + z).style.fill = '';
  }

  // ── Render tabla ─────────────────────────────────────────────────────────────
  function renderTabla(tipo) {
    const tbody = document.getElementById('tb-' + tipo);
    const regs  = st.regs[tipo];
    if (!regs.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="vacio">—</td></tr>'; return;
    }
    tbody.innerHTML = [...regs].reverse().map(r =>
      '<tr><td>' + r.numero + '</td><td>' + (r.zonaCancha || '—') + '</td><td>' + r.zonaArco + '</td>' +
      '<td><span class="chip ' + r.resultado + '">' + r.resultado + '</span></td></tr>'
    ).join('');
  }

  function renderTotales(tipo) {
    const regs = st.regs[tipo];
    const g = regs.filter(r => r.resultado==='Gol').length;
    const f = regs.filter(r => r.resultado==='Fallo').length;
    const p = regs.filter(r => r.resultado==='Parada').length;
    document.getElementById('tot-' + tipo).innerHTML =
      '<div class="badge g">Goles: ' + g + '</div>' +
      '<div class="badge f">Fallos: ' + f + '</div>' +
      '<div class="badge p">Paradas: ' + p + '</div>';
  }

  // ── Exportar PDF ─────────────────────────────────────────────────────────────
  function exportarPDF() {
    const p = partido();
    document.title = 'Estadística — ' + (p.equipoLocal || 'Local') +
                     ' vs ' + (p.equipoVisitante || 'Visitante') +
                     ' — ' + (p.fecha || '') + ' — ' + p.parte + '° parte';
    window.print();
    document.title = 'Estadística de Lanzamientos';
  }

  // ── Borrar sesión ─────────────────────────────────────────────────────────────
  function borrarSesion() {
    const p = partido();
    if (!p.equipoLocal || !p.equipoVisitante || !p.fecha) {
      alert('Completá los datos del partido para identificar qué borrar.'); return;
    }
    const etiqueta = p.equipoLocal + ' vs ' + p.equipoVisitante +
                     ' — ' + p.fecha + ' — ' + p.parte + '° parte';
    if (!confirm('¿Borrar todos los registros de:\n' + etiqueta + '?')) return;
    const todos    = JSON.parse(localStorage.getItem('imef_lanz') || '[]');
    const restante = todos.filter(r =>
      !(r.equipoLocal     === p.equipoLocal     &&
        r.equipoVisitante === p.equipoVisitante &&
        r.fecha           === p.fecha           &&
        String(r.parte)   === String(p.parte))
    );
    localStorage.setItem('imef_lanz', JSON.stringify(restante));
    st.regs['7m']   = [];
    st.regs['ca']   = [];
    st.regs['zona'] = [];
    ['7m','ca','zona'].forEach(t => { renderTabla(t); renderTotales(t); });
    flash('Sesión borrada.', 'ok');
  }

  // ── Flash ────────────────────────────────────────────────────────────────────
  function flash(msg, cls) {
    const el = document.getElementById('flash');
    el.textContent = msg;
    el.className = 'flash ' + cls;
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = 'flash'; }, 5000);
  }

  init();
</script>
</body>
</html>
